name: pipeline

on:
  schedule:
    # Каждые 30 минут, но не в :00 и :30 — это самое загруженное время у GitHub,
    # запуски там опаздывают и пропадают (в ноябре 2026 из 48 в сутки проходило 2–3).
    # Сам постинг ограничен MIN_GAP_MINUTES (lib/config.js).
    - cron: '13,43 * * * *'
  # Пуш кода конвейера в main — сразу один запуск: изменения проверяются в деле,
  # а не через полчаса. Журнал такого запуска кладётся в ветку stats.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'prompts/**'
      - 'db/sources.json'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # отчёты рубрики — в ветку power, журнал запуска после пуша — в ветку stats
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    defaults:
      run:
        shell: bash # -eo pipefail: ошибка шага не теряется за tee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: parse
        run: node scripts/parse.js 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: filter
        if: ${{ !cancelled() }}
        run: node scripts/filter.js 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      # Рубрика «Абсурд власти»: раз в неделю, в первом запуске после пятницы
      # 12:00 UTC. В остальных запусках — одна строка в журнале.
      - name: power
        if: ${{ !cancelled() }}
        run: node scripts/power.js 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: post
        if: ${{ !cancelled() }}
        run: node scripts/post.js 2>&1 | tee -a "$RUNNER_TEMP/run.log"

      - name: power archive
        if: ${{ !cancelled() && hashFiles('out/power/**') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/out/power"
          mkdir "$RUNNER_TEMP/power" && cd "$RUNNER_TEMP/power"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth=1 origin power; then git checkout -q -b power FETCH_HEAD; else git checkout -q --orphan power; fi
          mkdir -p issues && cp "$src"/* issues/
          git add issues
          names=$(ls "$src" | sed -n 's/\.md$//p' | tr '\n' ' ')
          git commit -q -m "Абсурд власти: ${names}" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:power && exit 0; git pull -q --rebase origin power; done
          exit 1

      - name: run log
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/run.log"; touch "$log"
          mkdir "$RUNNER_TEMP/stats" && cd "$RUNNER_TEMP/stats"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth=1 origin stats; then git checkout -q -b stats FETCH_HEAD; else git checkout -q --orphan stats; fi
          name="runs/$(date -u +%Y-%m-%dT%H%M)-${SHA:0:7}.log"
          mkdir -p runs && cp "$log" "$name"
          git add runs
          git commit -q -m "pipeline после пуша ${SHA:0:7}" || exit 0
          for i in 1 2 3; do git push -q origin HEAD:stats && exit 0; git pull -q --rebase origin stats; done
          exit 1
