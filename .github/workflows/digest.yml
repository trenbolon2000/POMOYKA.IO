name: digest

on:
  schedule:
    # 17:47 UTC = 20:47 МСК. Не в :00 — в начале часа GitHub перегружен, и
    # «Итоги дня» на 18:00 UTC приходили в 4–7 утра по Москве.
    - cron: '47 17 * * *'
  workflow_dispatch: {}

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # для записи keepalive (см. последний шаг)
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/digest.js

      # GitHub выключает расписание в публичном репозитории после 60 дней без
      # изменений (так «Помойка» встала в ноябре 2026). Если дате в
      # .github/keepalive больше 20 дней (или файла нет) — пишем сегодняшнюю и
      # коммитим. Не привязано к числу месяца: «Итоги дня» опаздывают за полночь,
      # и проверка «сегодня 1-е» могла пропустить месяц.
      - name: keepalive
        if: ${{ !cancelled() }}
        run: |
          f=.github/keepalive
          last=$(head -n 1 "$f" 2>/dev/null | tr -d '[:space:]' || true)
          if [ -n "$last" ] && last_s=$(date -u -d "$last" +%s 2>/dev/null); then
            age=$(( ( $(date -u +%s) - last_s ) / 86400 ))
            echo "keepalive: в файле $last, прошло $age дн."
            if [ "$age" -le 20 ]; then exit 0; fi
          fi
          date -u +%F > "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "keepalive: $(date -u +%F)" || exit 0
          # main мог уйти вперёд, пока шёл запуск, — догоняем и пушим ещё раз.
          git push || { git pull -q --rebase origin main && git push; }
