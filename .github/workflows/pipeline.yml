name: pipeline

on:
  schedule:
    # Каждые 30 минут, но не в :00 и :30 — это самое загруженное время у GitHub,
    # запуски там опаздывают и пропадают (в ноябре 2026 из 48 в сутки проходило 2–3).
    # Сам постинг ограничен MIN_GAP_MINUTES (lib/config.js).
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: parse
        run: node scripts/parse.js

      - name: filter
        if: ${{ !cancelled() }}
        run: node scripts/filter.js

      - name: post
        if: ${{ !cancelled() }}
        run: node scripts/post.js
