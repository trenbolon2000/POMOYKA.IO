name: trial-step2

# Пробный прогон шага 2 (сейчас — второй круг, trial/step2b.js; первый круг —
# trial/step2.js, его отчёт уже в trial/report/). Запускается сам при пуше в ветку
# trial-step2 и вручную. В базу ничего не пишет, в канал ничего не отправляет:
# ключей Telegram у этого workflow нет. Отчёт коммитится обратно в эту же ветку
# (trial/report/), чтобы его можно было прочитать без входа в GitHub.

on:
  push:
    branches: [trial-step2]
  workflow_dispatch: {}

concurrency:
  group: trial-step2
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write # только чтобы закоммитить отчёт в эту ветку
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: trial
        run: node trial/step2b.js
        timeout-minutes: 40
        continue-on-error: true

      - name: save report
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trial/report
          git commit -m "trial: отчёт шага 2, второй круг ($(date -u +%F' '%H:%M) UTC)" || exit 0
          git pull --rebase origin trial-step2 || true
          git push origin HEAD:trial-step2
