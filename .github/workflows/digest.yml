name: digest

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 21:00 МСК (DIGEST_HOUR_UTC=18)
  workflow_dispatch: {}

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # для ежемесячной записи keepalive (см. последний шаг)
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/digest.js

      # GitHub выключает расписание в публичном репозитории после 60 дней без
      # изменений (так «Помойка» встала в ноябре 2026). Раз в месяц, 1-го числа,
      # пишем дату в .github/keepalive — этого хватает, чтобы конвейер не встал.
      - name: keepalive
        if: ${{ !cancelled() }}
        run: |
          if [ "$(date -u +%d)" != "01" ]; then exit 0; fi
          date -u +%F > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keepalive: $(date -u +%F)" || exit 0
          git push
